name: Build Singlefile

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-singlefile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install aria2
        run: sudo apt install aria2 -y

      - name: Install LLVM
        run: sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)"

      - name: Set up Android NDK r23b
        run: |
          aria2c -o android-ndk-r23b-linux.zip https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q -d ~ android-ndk-r23b-linux.zip

      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          make

      - name: Download Android tzdata into rootfs
        run: |
          set -eu
          mkdir -p rootfs/system/usr/share/zoneinfo
          for BRANCH in main master; do
            URL="https://android.googlesource.com/platform/system/timezone/+/refs/heads/${BRANCH}/output_data/tzdata?format=TEXT"
            if curl -fsSL "$URL" | base64 -d > rootfs/system/usr/share/zoneinfo/tzdata; then
              if [ -s rootfs/system/usr/share/zoneinfo/tzdata ]; then
                exit 0
              fi
            fi
          done
          echo "failed to download Android tzdata"
          exit 1

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create singlefile executable
        run: |
          OUT="WrapperSingle.x86_64.${{ steps.vars.outputs.sha_short }}.run"
          cat > "$OUT" <<'EOF'
          #!/usr/bin/env bash
          set -eu
          ORIG_DIR="$(cd "$(dirname "$0")" && pwd)"
          TMP_DIR="$(mktemp -d)"
          cleanup() { rm -rf "$TMP_DIR"; }
          trap cleanup EXIT INT TERM

          ARCHIVE_LINE="$(awk '/^__ARCHIVE_BELOW__$/ {print NR + 1; exit 0;}' "$0")"
          tail -n +"$ARCHIVE_LINE" "$0" | tar -xz -C "$TMP_DIR"

          if [ -f "$ORIG_DIR/cookie.txt" ]; then
            export WRAPPER_COOKIE="$(tr -d '\r\n' < "$ORIG_DIR/cookie.txt")"
          fi

          cd "$TMP_DIR"
          chmod +x ./wrapper
          exec ./wrapper "$@"
          __ARCHIVE_BELOW__
          EOF
          tar -cz rootfs wrapper >> "$OUT"
          chmod +x "$OUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WrapperSingle.x86_64.${{ steps.vars.outputs.sha_short }}
          path: WrapperSingle.x86_64.${{ steps.vars.outputs.sha_short }}.run
