---
name: Docker Publish
on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      image:
        description: Docker image name (Linux container)
        required: false
        default: wrapper
        type: string
      tag:
        description: Override image tag
        required: false
        type: string
      push_latest:
        description: Also push :latest
        required: false
        default: true
        type: boolean
      platforms:
        description: Target platforms (macOS/Windows use Linux containers)
        required: false
        default: linux/amd64,linux/arm64
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install aria2
        run: sudo apt install aria2 -y
      - name: Install LLVM
        run: sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)"
      - name: Set up Android NDK r23b
        run: |
          aria2c -o android-ndk-r23b-linux.zip https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q -d ~ android-ndk-r23b-linux.zip
      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          make
      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Prepare Docker build context
        id: prep
        run: |
          set -e
          if [ -z "${{ inputs.tag }}" ]; then
            SHA_TAG="${{ steps.vars.outputs.sha_short }}"
          else
            SHA_TAG="${{ inputs.tag }}"
          fi
          echo "sha_tag=$SHA_TAG" >> $GITHUB_OUTPUT
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Compute tags
        id: tags
        run: |
          T="docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image }}:${{ steps.prep.outputs.sha_tag }}"
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            T="$T,docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image }}:latest"
          fi
          echo "value=$T" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
