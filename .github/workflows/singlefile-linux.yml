name: Build Singlefile (Linux)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-singlefile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            unzip \
            wget \
            zip \
            musl-tools \
            tzdata

      - name: Set up Android NDK r23b
        run: |
          wget -O android-ndk-r23b-linux.zip https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q -d ~ android-ndk-r23b-linux.zip

      - name: Build main (Android userspace)
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j"$(nproc)" main

      - name: Add tzdata into rootfs (bionic timezone)
        run: |
          TZDATA_PATH="/usr/share/zoneinfo/tzdata"
          if [ ! -f "$TZDATA_PATH" ]; then
            TZDATA_PATH="$(find "$HOME/android-ndk-r23b" -type f -path '*/usr/share/zoneinfo/tzdata' | head -n 1)"
          fi
          if [ -z "$TZDATA_PATH" ] || [ ! -f "$TZDATA_PATH" ]; then
            TZDATA_PATH="$(find "$HOME/android-ndk-r23b" -type f -name 'tzdata' | head -n 1)"
          fi
          if [ -n "$TZDATA_PATH" ] && [ -f "$TZDATA_PATH" ]; then
            cp "$TZDATA_PATH" tzdata
          else
            : > tzdata
          fi
          mkdir -p rootfs/system/usr/share/zoneinfo
          mkdir -p rootfs/data/misc/zoneinfo
          if [ -s tzdata ]; then
            cp tzdata rootfs/system/usr/share/zoneinfo/tzdata
            cp tzdata rootfs/data/misc/zoneinfo/tzdata
          fi
          ld -r -b binary tzdata -o tzdata.o

      - name: Build singlefile wrapper (static, embeds rootfs)
        run: |
          tar -C rootfs -cf rootfs.tar .
          ld -r -b binary rootfs.tar -o rootfs_tar.o
          musl-gcc -O2 -static -s -DWRAPPER_EMBED_ROOTFS -DWRAPPER_EMBED_TZDATA -o wrapper wrapper.c cmdline.c rootfs_tar.o tzdata.o
          file wrapper
          (ldd wrapper || true)

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrapper.singlefile.linux.x86_64.${{ steps.vars.outputs.sha_short }}
          path: wrapper

      - name: Create Release Zip File
        run: zip -r wrapper.singlefile.linux.x86_64.${{ steps.vars.outputs.sha_short }}.zip wrapper

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: wrapper.singlefile.linux.x86_64.${{ steps.vars.outputs.sha_short }}.zip
          body: ${{ github.event.head_commit.message }}
          name: wrapper.singlefile.linux.x86_64.${{ steps.vars.outputs.sha_short }}
          tag_name: wrapper.singlefile.linux.x86_64.${{ steps.vars.outputs.sha_short }}
          make_latest: true
