name: Build Singlefile (Linux)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-singlefile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            unzip \
            wget \
            zip \
            musl-tools

      - name: Set up Android NDK r23b
        run: |
          wget -O android-ndk-r23b-linux.zip https://dl.google.com/android/repository/android-ndk-r23b-linux.zip
          unzip -q -d ~ android-ndk-r23b-linux.zip

      - name: Build main (Android userspace)
        run: |
          mkdir -p build
          cd build
          cmake ..
          make -j"$(nproc)" main

      - name: Build singlefile wrapper (static, embeds rootfs)
        run: |
          tar -C rootfs -cf rootfs.tar .
          ld -r -b binary rootfs.tar -o rootfs_tar.o
          musl-gcc -O2 -static -s -DWRAPPER_EMBED_ROOTFS -o wrapper wrapper.c cmdline.c rootfs_tar.o
          file wrapper
          (ldd wrapper || true)

      - name: Set outputs
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrapper.singlefile.linux.x86_64.${{ steps.vars.outputs.sha_short }}
          path: wrapper
